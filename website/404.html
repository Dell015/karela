<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Karela</title>
    <meta name="description" content="That page doesn't exist. Head back to the Karela homepage." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />

    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/sections.css" />
  </head>

  <body>
    <main
      id="main"
      class="section theme-brand"
      style="
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
      "
    >
      <div class="glow-orb glow-orb--brand glow-orb--center" aria-hidden="true"></div>

      <div class="container container--narrow">
        <a href="index.html" aria-label="Karela — home">
          <img
            src="assets/img/karela_word-logo.png"
            alt="Karela"
            width="171"
            height="30"
            style="margin: 0 auto var(--space-3xl)"
          />
        </a>

        <p class="eyebrow" style="justify-content: center">Error 404</p>

        <h1 style="font-size: var(--fs-display); margin-bottom: var(--space-xl)">
          This route isn't on the map
          <span class="gradient-text">yet.</span>
        </h1>

        <p class="lead" style="margin: 0 auto var(--space-3xl)">
          The page you're looking for doesn't exist — or it moved. Either way,
          the quest continues back at the start.
        </p>

        <a class="btn btn--primary btn--lg" href="index.html">Back to home</a>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
