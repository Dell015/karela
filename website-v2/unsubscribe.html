<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove me from the waitlist</title>
    <meta name="description" content="Remove your email from the Karela waitlist." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0f0c" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="assets/img/favicon-k-32.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/simple.css" />
  </head>

  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__blob bg__blob--1"></div>
      <div class="bg__blob bg__blob--2"></div>
      <div class="bg__grain"></div>
    </div>

    <main id="main" class="simple">
      <a class="simple__logo" href="/" aria-label="Karela, home">
        <img src="assets/img/karela_word-logo.png" alt="Karela" width="160" height="28" />
      </a>

      <h1 class="simple__title">Remove me from the waitlist</h1>
      <p class="simple__lead" data-unsub-lead>
        This takes your email off the Karela waitlist. We won't email you
        again, including when the beta opens.
      </p>

      <button class="btn btn--primary" type="button" data-unsub-button hidden>Remove me</button>
      <p class="simple__msg" data-unsub-msg role="status" aria-live="polite">
        <noscript>This page needs JavaScript to remove you. Reply to the email instead and we'll remove you by hand.</noscript>
      </p>

      <a class="link simple__back" href="/">Back to the site</a>
    </main>

    <script src="js/config.js"></script>
    <script src="js/unsubscribe.js"></script>
  </body>
</html>
