<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Karela</title>
    <meta name="description" content="That page doesn't exist. Head back to the Karela homepage." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0f0c" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="/assets/img/favicon-k-32.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/simple.css" />
  </head>

  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__blob bg__blob--1"></div>
      <div class="bg__blob bg__blob--2"></div>
      <div class="bg__grain"></div>
    </div>

    <main id="main" class="simple">
      <a class="simple__logo" href="/" aria-label="Karela, home">
        <img src="/assets/img/karela_word-logo.png" alt="Karela" width="160" height="28" />
      </a>

      <div class="sprite sprite--walk simple__ani" aria-hidden="true"></div>

      <h1 class="simple__title">This page isn't <span class="grad">on the map.</span></h1>
      <p class="simple__lead">
        The link may be old, or the page moved. Everything about Karela is on
        the homepage.
      </p>

      <div class="simple__actions">
        <a class="btn btn--primary" href="/">Back to the homepage</a>
        <a class="btn btn--outline" href="/demo">Try the app</a>
      </div>
    </main>
  </body>
</html>
